<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Ambient Radial Glow behind the icon -->
    <radialGradient id="amberGlow" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#EA580C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtitle & Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="50%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Filter for soft drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Mini logo icon definition -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Radial Glow Behind Logo -->
  <rect width="1200" height="420" fill="url(#amberGlow)"/>

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
  </g>

  <!-- Central Brand Icon Container -->
  <g transform="translate(540, 48)" filter="url(#shadow)">
    <!-- Squircle Tile -->
    <rect x="0" y="0" width="120" height="120" rx="30" fill="url(#iconBg)" stroke="#334155" stroke-width="1.5"/>
    <rect x="1" y="1" width="118" height="58" rx="28" fill="#FFFFFF" fill-opacity="0.04"/>

    <!-- Geometric Bridge Symbol -->
    <g transform="translate(24, 24)">
      <!-- Left Mac Arch (Warm Orange) -->
      <path d="M 12 56 L 24 16 L 38 16 L 26 56 Z" fill="url(#accentGrad)"/>
      <circle cx="25" cy="56" r="6" fill="#F97316"/>
      <!-- Right Android Arch (Slate Blue / Ice White) -->
      <path d="M 48 16 L 60 56 L 46 56 L 34 16 Z" fill="#94A3B8"/>
      <circle cx="47" cy="16" r="6" fill="#E2E8F0"/>
      <!-- Interlocking Central Beam -->
      <rect x="22" y="32" width="28" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9"/>
    </g>
  </g>

  <!-- Main Wordmark -->
  <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5" fill="url(#textGrad)">
    NacMac
  </text>

  <!-- Accent Dot / Badge -->
  <text x="600" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="20" font-weight="500" fill="url(#accentGrad)" letter-spacing="0.5">
    Peer-to-Peer Continuity for macOS &amp; Android
  </text>

  <!-- Punchy Subtitle -->
  <text x="600" y="318" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="15" font-weight="400" fill="#94A3B8" letter-spacing="0.2">
    Instant File Transfers · Notification Mirroring · Clipboard Sync · 100% Local P2P
  </text>

  <!-- Tag Badges Pill Row -->
  <g transform="translate(370, 352)">
    <rect x="0" y="0" width="460" height="34" rx="17" fill="#0B1222" stroke="url(#badgeBorder)" stroke-width="1"/>
    <text x="230" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', 'Roboto Mono', monospace" font-size="12" font-weight="500" fill="#CBD5E1" letter-spacing="0.8">
      ZERO CLOUD  ·  ZERO ACCOUNTS  ·  END-TO-END LOCAL WI-FI
    </text>
  </g>
</svg>
