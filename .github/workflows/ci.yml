name: NacMac CI

on:
  push:
    branches: [ main, Preem ]
  pull_request:
    branches: [ main, Preem ]

jobs:
  macos-build-and-test:
    name: macOS Build & Protocol Tests
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Build macOS App
        run: |
          cd macos
          swift build -c release

      - name: Run Phase 2 & Continuity Integration Tests
        run: |
          cd macos && ./package_app.sh
          cd ..
          python3 tests/test_phase2_multi_device.py
          killall -9 NacMac 2>/dev/null || true
          sleep 2
          python3 tests/test_e2e_continuity.py

  android-build-and-test:
    name: Android Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Unit Tests
        run: |
          cd android
          ./gradlew test

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease
